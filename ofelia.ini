# ofelia.ini

# JOB 1: Triggers your data-sync API every hour
; [job-local "auto-attendance-record-creation"]
; schedule = @hourly
; command = sh -c 'wget --post-data=\"\" --header=\"x-cron-token: super_secret\" -O- http://backend:3000/api/attendance/create/now'
; no-overlap = true

# Hourly trigger — the endpoint itself only refreshes symbols whose
# updated_at is older than 12h, so data updates every half day.
[job-local "stock-list-refresh"]
schedule = @hourly
command = sh -c 'wget --post-data=\"\" -O- http://omninance-backend:8000/api/stock-list/refresh'
no-overlap = true

# Hourly trigger — TDCC publishes holder data weekly (dated Friday); the
# endpoint no-ops until new Friday data appears, then upserts it into MongoDB.
[job-local "holder-refresh"]
schedule = 0 5 * * * *
command = sh -c 'wget --post-data=\"\" -O- http://omninance-backend:8000/api/holders/refresh'
no-overlap = true

# Hourly trigger — TWSE/TPEx publish one new bar per trading day; the
# endpoint no-ops until a symbol is missing the most recently expected
# trading day's bar, then backfills just the missing range via yfinance.
[job-local "ticker-refresh"]
schedule = @hourly
command = sh -c 'wget --post-data=\"\" -O- http://omninance-backend:8000/api/tickers/refresh'
no-overlap = true

# Mon-Fri 10:04 Asia/Taipei — execute buy/sell orders for every active
# strategy's pending (post-market) signal log. No dedicated route for this
# job; goes through the generic schedule trigger (src/routes/schedule.py).
[job-local "daily-strategies"]
schedule = 0 4 10 * * mon-fri
command = sh -c 'wget --post-data=\"\" -O- http://omninance-backend:8000/api/schedules/daily_strategies/trigger'
no-overlap = true

# Mon-Fri 15:00 Asia/Taipei — settle equity/PnL for today's executed daily logs.
[job-local "finalize-daily-settlement"]
schedule = 0 0 15 * * mon-fri
command = sh -c 'wget --post-data=\"\" -O- http://omninance-backend:8000/api/schedules/finalize_daily_settlement/trigger'
no-overlap = true

# Mon-Fri 15:30 Asia/Taipei — compute next-day signals and create Pending
# daily logs for every active strategy.
[job-local "compute-signals"]
schedule = 0 30 15 * * mon-fri
command = sh -c 'wget --post-data=\"\" -O- http://omninance-backend:8000/api/schedules/nightly_signal_generate/trigger'
no-overlap = true
